# SkyHaxe browser client config. Edit and reload the page -- no rebuild needed.
#
# Same format and precedence as NGHWin's config.ini: derived defaults < this file.
# A value set here is handed to the client as a host parameter, which the client's own
# configuration marks read-only -- so it also wins over external_dev_vars.txt.

# Shorthand: every gamedata URL below is derived from this unless stated explicitly.
# Left unset it defaults to the origin serving the client, plus /ngh.
#
# Keep it same-origin. The shipped external_dev_vars.txt names absolute URLs on port 80, and a
# browser blocks reading those from a page served anywhere else; localization then never
# completes and the configuration manager stays locked with the rest of the graph behind it.
#base.url=http://localhost:8766/ngh
#gordon.path=/gordon/PRODUCTION-201611291003-338511768/

# Unset, these default to the page's own hostname and the WebSocket gateway port.
# A browser cannot open a raw socket, so this is the gateway, not the AIR client's 3000/3001.
#connection.info.host=localhost
#connection.info.port=2096

# Uncomment to override individual URLs without changing base.url:
#external.variables.txt=http://localhost:8766/ngh/gamedata/external_dev_vars.txt
#external.texts.txt=http://localhost:8766/ngh/gamedata/external_dev_texts.txt
#flash.client.url=http://localhost:8766/ngh/gordon/PRODUCTION-201611291003-338511768/
