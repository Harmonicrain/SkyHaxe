# SkyHaxe browser client config. Edit and reload the page -- no rebuild needed.
#
# Same format and precedence as NGHWin's config.ini: derived defaults < this file.
# A value set here is handed to the client as a host parameter, which the client's own
# configuration marks read-only -- so it also wins over external_dev_vars.txt.

# Shorthand: every gamedata URL below is derived from this unless stated explicitly.
# Left unset it defaults to the origin serving the client, plus /runtime.
#
# Keep it same-origin. The shipped external_dev_vars.txt names absolute URLs on port 80, and a
# browser blocks reading those from a page served anywhere else; localization then never
# completes and the configuration manager stays locked with the rest of the graph behind it.
#base.url=https://assets.example.test/original-client
#gordon.path=/gordon/PRODUCTION-201611291003-338511768/

# Unset, these default to the page's own hostname and the WebSocket gateway port.
# A browser cannot open a raw socket, so this is the gateway, not the AIR client's 3000/3001.
#connection.websocket.url=wss://gateway.example.test/

# Optional CMS iframe bridge. Use the exact website origin, with no path. Leave blank for the
# standalone client. This value is public and is used only as a postMessage target allowlist.
#cms.parent.origin=https://hotel.example.test

# Habbo HTML5 fonts are included in the prebuilt release.
#text.resource.base=https://client.example.test/assets/habbo-text

# Optional same-origin image bridge for remote images whose server does not send CORS headers.
# The source is restricted to this prefix; image.proxy.url is the public proxy route prefix.
#image.proxy.source.url=https://images.example.test/c_images/
#image.proxy.url=https://client.example.test/image-proxy/

# Uncomment to override individual URLs without changing base.url:
#external.variables.txt=https://assets.example.test/original-client/gamedata/external_dev_vars.txt
#external.texts.txt=https://assets.example.test/original-client/gamedata/external_dev_texts.txt
#flash.client.url=https://assets.example.test/original-client/gordon/PRODUCTION-201611291003-338511768/

# .hab asset bundles made by swf2hab (C:\habbo\swf2hab -> C:\habbo\ngh\hab). A SWF URL under a
# source prefix loads its .hab twin from the mirror at the same position; a missing or failed
# .hab falls back to the SWF for that file only. Empty asset.hab.url = SWFs only.
# Per page load, ?assets=swf or ?assets=hab overrides this (A/B testing).
asset.hab.source.url=/runtime/|http://localhost/ngh/
asset.hab.url=/runtime/hab/|http://localhost/ngh/hab/
